name: Check docs and skills are up to date

on:
  pull_request:
    branches:
      - main

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create placeholder for embedded binary
        run: mkdir -p internal/utils/embedded-binaries && touch internal/utils/embedded-binaries/type-morph-linux-amd64

      - name: Generate docs and skills
        run: |
          go run ./cmd/suprsend/main.go gendocs docs/
          go run ./cmd/suprsend/main.go genskills skills/

      - name: Check for differences
        run: |
          if [ -n "$(git status --porcelain docs/ skills/)" ]; then
            echo "::error::docs/ or skills/ are out of date. Run 'make build' and commit the changes."
            git diff --stat docs/ skills/
            exit 1
          fi
