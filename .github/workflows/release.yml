name: Release

on:
  push:
    tags:
      - 'v*'
  
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.25.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      
      - name: Configure AWS credentials (for KMS signing)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Import Apple Certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
        run: |
          echo "$MACOS_SIGN_P12" | base64 --decode > certificate.p12
      
      - name: Import Notary Key
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          echo "$MACOS_NOTARY_KEY" | base64 --decode > notary-key.p8
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_URI: awskms:///alias/suprsend-release
          MACOS_SIGN_P12: certificate.p12
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: notary-key.p8
          PRIVATE_KEY_PATH: ${{ secrets.HOMEBREW_DEPLOY_KEY }}